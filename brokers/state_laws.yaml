  - state: CA
    statute_name: "California Consumer Privacy Act as amended by the CPRA; Delete Act (SB 362)"
    citation: "Cal. Civ. Code 1798.100 et seq. (deletion: 1798.105); Delete Act: Cal. Civ. Code 1798.99.80 et seq."
    effective_date: 2020-01-01
    rights: [know, delete, correct, opt_out_sale, opt_out_sharing, limit_sensitive, non_discrimination]
    response_days: 45
    extension_days: 45
    data_broker_law: "Delete Act: data brokers must register annually with the California Privacy Protection Agency (Jan 1-31) and, from 2026-08-01, process deletion requests submitted through the DROP platform."
    government_portal_url: https://cppa.ca.gov/
    ag_complaint_url: https://oag.ca.gov/contact/consumer-complaint-against-business-or-company
    other_complaint_urls: [https://cppa.ca.gov/]
    authorized_agent_allowed: true
    template: ccpa
    notes: >-
      Verified on oag.ca.gov/privacy/ccpa: delete right; 45 calendar days to respond, +45 with notice;
      authorized agent may be a person or a business registered with the CA Secretary of State; complaints
      to the AG and (since 2023-07-01) the CPPA. DROP start date 2026-08-01 is from a secondary source
      (privacylawmap.com); cppa.ca.gov/delete returned 404, so the exact DROP portal URL is left to the
      registry entry ca_drop. government_portal_url is the CPPA home page only. Delete Act citation is
      from background knowledge.
    source_urls:
      - https://oag.ca.gov/privacy/ccpa
      - https://privacylawmap.com/blog/data-broker-registration-requirements-2026
