  - state: NC
    statute_name: "None in force. Consumer privacy bills (S 757 / S 1022 'North Carolina Consumer Privacy Act', H 462) not enacted."
    rights: []
    data_broker_law: "None found (no NC data-broker registry located)."
    template: generic
    notes: >-
      As of 2026-11-06 North Carolina has NO comprehensive consumer privacy law, so no legal right to
      delete data held by brokers. Official ncleg.gov page for S 1022 (Consumer Privacy Act, filed
      2026-04-30): last action 2026-05-05 re-referred to Appropriations/Base Budget; no votes. Earlier S 757
      (introduced 2025-03-25) was referred to Rules and no later action found. H 462 (NC Personal Data
      Privacy Act) reported in committee, not enacted. Use the generic voluntary-request letter; do not
      cite any NC statute. Re-check after the next session convenes.
    source_urls:
      - https://www.ncleg.gov/BillLookUp/2025/S1022
      - https://www.ncleg.gov/Sessions/2025/Bills/Senate/HTML/S1022v1.html
