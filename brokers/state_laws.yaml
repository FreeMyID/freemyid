# State privacy-law registry for Free My ID. Maintained by broker-researcher. Researched 2026-11-06; citations re-checked 2026-11-07 and 2026-11-08.
#
# Template rule: `ccpa` = CA only; `state_privacy` = comprehensive law IN FORCE today;
# `generic` = no applicable law today (voluntary request, NO legal citation in the letter).
# States whose law is enacted but not yet effective stay `generic` until effective_date passes.
#
# `citation` format: "<code> (deletion: <section of the delete right>; response: <section of the deadline>)".
# Evidence levels (stated in each entry's notes):
#  - STATUTE TEXT: the deletion-right subsection and the response window were read on an official legislature, code or AG
#    page (or the enacted bill on the legislature's own site) on the entry's last_verified date. Later amendments to the
#    code were not diffed unless noted.
#  - BACKGROUND / UNVERIFIED: not read in statute text. Do NOT quote the section number in a letter without a human check.
#  - ag_complaint_url: only set where the page was fetched OK, or flagged in notes as seen-but-not-opened.
# Plain truth for letters: a deletion right reaches a people-search site only if the site meets the law's size threshold and the
# data is not 'publicly available information'. Most laws exclude public-record data. Write letters as requests, not demands.
# Companion file with per-state broker notes: brokers/state_law_deletion_matrix.yaml.
# YAML anchors (&new, &ms) are defined at first use and reused below.
version: "2026.11.2"
updated: 2026-11-08

