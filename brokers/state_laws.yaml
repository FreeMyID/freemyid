# State privacy-law registry for Free My ID. Maintained by broker-researcher. Researched 2026-11-06.
#
# Template rule: `ccpa` = CA only; `state_privacy` = comprehensive law IN FORCE today;
# `generic` = no applicable law today (voluntary request, NO legal citation in the letter).
# States whose law is enacted but not yet effective stay `generic` until effective_date passes.
#
# Evidence levels (see each entry's notes):
#  - effective dates / law names / "enacted" status: seen in fetched pages or search results (source_urls).
#  - statutory citations and 45-day response windows for comprehensive-law states: NOT re-fetched from
#    statute text in this pass (secondary trackers did not list them). They come from the researcher's
#    background knowledge; last_verified is left null for those entries. Verify before quoting in a letter.
#  - ag_complaint_url: only set where the page was fetched OK or is flagged UNVERIFIED in notes.
# YAML anchors (&pt, &new, &ms) are defined at first use and reused below.
