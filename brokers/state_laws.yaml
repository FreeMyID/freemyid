  - state: AZ
    statute_name: "None in force. SB 1815 (consumer data rights) and SB 1790 (data-broker registration) not enacted."
    rights: []
    data_broker_law: "None in force. SB 1790 (2026) would have required data-broker registration with the Secretary of State; no sign it was enacted."
    template: generic
    notes: >-
      As of 2026-11-06 Arizona has NO comprehensive consumer privacy law and no enforceable deletion right.
      SB 1815 (access/correct/delete/opt-out; 45-day response; AG enforcement) was introduced Feb 2026 and
      died when the session ended 2026-06-13. SB 1790 (data-broker notice + Secretary of State
      registration, text at azleg.gov) was last seen read a second time in the Senate on 2026-02-10; no
      later action or signature found and the Legislature adjourned sine die in June, so treat it as NOT
      law. The azleg.gov bill-status page was not fetchable here (legiscan/legilist returned 403), so the
      final status of SB 1790 is "no evidence of enactment", not confirmed dead. Existing narrow levers:
      A.R.S. 18-552 (breach notice), Consumer Fraud Act (broker that misrepresents its opt-out), A.R.S.
      11-483 (county recorder redaction for peace officers, judges, protective-order holders) and the
      Secretary of State Address Confidentiality Program for abuse/stalking survivors; all narrow and
      eligibility-based. Use the generic voluntary-request letter. Next window: session starting Jan 2027.
    source_urls:
