  - state: SC
    statute_name: "None in force for general consumers. Age-Appropriate Code Design Act (minors only) signed Feb 2026."
    rights: []
    data_broker_law: "None found."
    template: generic
    notes: >-
      As of 2026-11-06 South Carolina has NO comprehensive consumer privacy law and no right to delete.
      H.3401 (Technology Transparency / consumer data privacy) was prefiled 2024-12-05 and referred to House
      Judiciary 2025-01-14 (scstatehouse.gov); no later action. The only 2026 enactment found is the
      Age-Appropriate Code Design Act (H 3431, signed early Feb 2026, AG-enforced), which covers minors'
      data on online services, not adults' broker records; do not cite it against people-search sites.
      Breach-notification law S.C. Code 39-1-90 exists but gives no deletion right. Use the generic
      voluntary-request letter; do not cite a SC statute.
    source_urls:
      - https://www.scstatehouse.gov/billsearch.php?billnumbers=3401&session=126&summary=B
      - https://www.privacyon.com/blog/privacy-laws-in-south-carolina
      - https://webiis08.mondaq.com/unitedstates/data-protection/1750154/south-carolina-enacts-new-data-privacy-law-protecting-minors-what-companies-need-to-know-before-july-1
      - https://www.multistate.us/insider/2026/10/28/twenty-four-states-now-have-comprehensive-consumer-privacy-laws
    last_verified: 2026-11-06

  - state: AZ
    statute_name: "None in force. SB 1815 (consumer data rights) and SB 1790 (data-broker registration) not enacted."
    rights: []
    data_broker_law: "None in force. SB 1790 (2026) would have required data-broker registration with the Secretary of State; no sign it was enacted."
    template: generic
    notes: >-
      As of 2026-11-06 Arizona has NO comprehensive consumer privacy law and no enforceable deletion right.
      SB 1815 (access/correct/delete/opt-out; 45-day response; AG enforcement) was introduced Feb 2026 and
      died when the session ended 2026-06-13. SB 1790 (data-broker notice + Secretary of State
      registration, text at azleg.gov) was last seen read a second time in the Senate on 2026-02-10; no
      later action or signature found and the Legislature adjourned sine die in June, so treat it as NOT
      law. The azleg.gov bill-status page was not fetchable here (legiscan/legilist returned 403), so the
      final status of SB 1790 is "no evidence of enactment", not confirmed dead. Existing narrow levers:
      A.R.S. 18-552 (breach notice), Consumer Fraud Act (broker that misrepresents its opt-out), A.R.S.
      11-483 (county recorder redaction for peace officers, judges, protective-order holders) and the
      Secretary of State Address Confidentiality Program for abuse/stalking survivors; all narrow and
      eligibility-based. Use the generic voluntary-request letter. Next window: session starting Jan 2027.
    source_urls:
      - https://www.azleg.gov/legtext/57leg/2R/bills/SB1815P.htm
      - https://www.azleg.gov/legtext/57leg/2R/bills/SB1790P.htm
      - https://www.privacyon.com/blog/how-to-opt-out-of-data-brokers-in-arizona
      - https://www.multistate.us/insider/2026/10/28/twenty-four-states-now-have-comprehensive-consumer-privacy-laws
    last_verified: 2026-11-06

