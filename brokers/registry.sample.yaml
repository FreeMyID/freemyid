version: "2026.11.06-sample"
updated: 2026-11-06
# SAMPLE broker registry (public). A small, representative slice of the maintained Free My ID
# registry, licensed CC BY-NC 4.0 (see brokers/LICENSE-DATA.md). The full maintained registry
# (several hundred brokers, kept current) is not in the public repository; it ships with
# family/private builds and through the registry update feed (config registry_url).
# Each entry below is copied verbatim from the maintained registry; see brokers/SOURCES.md.
brokers:
  - id: ca_drop
    name: California DROP (Delete Request and Opt-out Platform)
    url: https://privacy.ca.gov/drop/
    category: other
    domains: [privacy.ca.gov, consumer.drop.privacy.ca.gov]
    opt_out_url: https://consumer.drop.privacy.ca.gov
    method: account_required
    required_fields: [full_name, dob, zip]
    needs_email_verification: true
    needs_id_upload: false
    typical_processing_days: 90
    recheck_interval_days: 90
    ca_registered: false
    legal_basis_notes: "California Delete Act (SB 362). From 2026-08-01 registered data brokers must check DROP at least every 45 days; status updates can take up to 90 days."
    steps:
      - "Only for people who live in California. Open the DROP web address."
      - "Prove who you are with the State of California sign-in. You do this yourself."
      - "Make a profile with only the details you choose to share."
      - "Send one deletion request. It reaches 600+ registered data brokers and is free."
      - "Come back in about 3 months to see the results."
    source_urls: [https://privacy.ca.gov/drop/, https://privacy.ca.gov/drop/how-drop-works/, https://privacy.ca.gov/2026/10/drop-faq-blog/]
    verification_status: verified
    verification_notes: "privacy.ca.gov/drop page fetched 2026-11-05 and matched. The consumer.drop.privacy.ca.gov host is named on that page but was not itself fetched. Identity check happens on the state site; Free My ID must hand off to the human (TodoKind.GOVERNMENT_PORTAL)."
    last_verified: 2026-11-07
    priority: 95
  - id: spokeo
    name: Spokeo
    success_text: ["We've received your request to remove the profile"]
    listing_url_pattern: "^/[A-Za-z0-9-]+/[A-Za-z0-9-]+/[A-Za-z0-9-]+/p[0-9]+$"
    url: https://www.spokeo.com/
    category: people_search
    domains: [www.spokeo.com, spokeo.com]
    opt_out_url: https://www.spokeo.com/optout
    method: web_form
    alt_methods: [email, phone]
    opt_out_email: CustomerCare@spokeo.com
    phone: "1 (877) 864-0183"
    required_fields: [listing_url, email]
    needs_email_verification: true
    confirmation_domains: [spokeo.com]
    typical_processing_days: 3
    ca_registered: true
    steps:
      - "Search for yourself on Spokeo and open your listing."
      - "Copy the web address of that listing from the top of your browser."
      - "Go to the opt-out page. Paste the web address and type your removal email."
      - "Press the button to send."
      - "Open the email Spokeo sends you and click its link."
    source_urls: [&badbool https://github.com/yaelwrites/Big-Ass-Data-Broker-Opt-Out-List, https://www.spokeo.com/privacy-policy, https://cppa.ca.gov/data_broker_registry/registry2025.csv]
    verification_status: unverified
    verification_notes: "Opt-out page /optout returned HTTP 403 (bot protection), so unverified. Email source: Spokeo's own privacy policy (fetched 2026-11-06) lists CustomerCare@spokeo.com for general privacy questions and says EEA users may email it to request erasure; deletion for others is via its web form or phone (877) 864-0183. privacy@spokeo.com is named there only for the Data Protection Officer and appeals; the CA registry primary contact is legal@spokeo.com. The registry also lists freepeopledirectory.com, peoplewin.com and thatsthem.com as Spokeo sites. BADBOOL warns paid accounts may keep removed data."
    priority: 90
    search_url_pattern: https://www.spokeo.com/{first}-{last}/{state_name}/{city}
    search_access: bot_blocked
    search_access_note: 'Direct fetch returned HTTP 403. Pages are indexed by the search tool, so they are public in a browser. Name-only and state-only pages also exist: /John-Smith/Colorado.'
    search_url_checked: '2026-11-07'
    slug_case: title
