# Site v3: builds web/ (Astro static output) and publishes web/dist to GitHub Pages.
# Live since the v3 switch-over; the v2 site/ workflow is kept inactive as pages-v2.yml.draft.
# Rollback to v2: see docs/handoff/web-v3.md (git mv -f pages-v2.yml.draft pages.yml, commit, push)
# (site_src/ and site/ stay in the repo and are still rebuilt by build.yml after each release).
# Free GitHub Pages needs a PUBLIC repository: while the repo is private the deploy job is skipped.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", "site_src/**", "brokers/registry.sample.yaml", "tools/site_check.py",
            "tests/test_web_*.py", "tests/codex/test_cx_developer_og_metadata.py",
            "tests/conftest.py", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**", "site_src/**", "brokers/registry.sample.yaml", "tools/site_check.py",
            "tests/test_web_*.py", "tests/codex/test_cx_developer_og_metadata.py",
            "tests/conftest.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Astro build telemetry off (SEC-60): astro build/dev would otherwise POST to telemetry.astro.build,
# CI included. web/package.json sets it too; the first build step fails if it is missing.
env:
  ASTRO_TELEMETRY_DISABLED: "1"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # Actions pinned to full commit SHAs (SEC-61). Update the SHA and the comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0   # git dates for sitemap <lastmod> (WR-39)
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Astro telemetry is off (SEC-60)
        run: |
          test "${ASTRO_TELEMETRY_DISABLED:-}" = "1" || { echo "::error::ASTRO_TELEMETRY_DISABLED must be 1"; exit 1; }
          # Every `astro` call in a package.json script (any form: pnpm exec, npx, after ; or &&) must be
          # prefixed with ASTRO_TELEMETRY_DISABLED=1 in its own command segment.
          node -e 'const s=require(process.argv[1]||"./package.json").scripts;const bad=[];for(const[k,c]of Object.entries(s))for(const seg of c.split(/&&|\|\||[;|&]/)){if(/(^|\s)astro(\s|$)/.test(seg)&&!/^\s*ASTRO_TELEMETRY_DISABLED=1\s/.test(seg))bad.push(k)}if(bad.length){console.error("astro run without ASTRO_TELEMETRY_DISABLED=1:",[...new Set(bad)].join(", "));process.exit(1)}'
      - name: Install (exact versions from the lockfile)
        run: pnpm install --frozen-lockfile
      # Fails on high/critical advisories (SEC-67). Sends the dependency list to registry.npmjs.org (CI only).
      # Documented exceptions go in web/audit-ignore.txt (one CVE id per line, '#' comments); see docs/handoff/devops-engineer.md.
      - name: Dependency audit (pnpm audit, high and critical fail)
        run: |
          ign=()
          if [ -f audit-ignore.txt ]; then
            while read -r id _; do case "$id" in ''|\#*) ;; *) ign+=(--ignore "$id");; esac; done < audit-ignore.txt
          fi
          pnpm audit --audit-level=high "${ign[@]}"
      - name: Design tokens are up to date (contrast pairs checked)
        run: node scripts/gen-tokens.mjs --check
      - name: Build (astro build + per-page CSP tightening)
        run: pnpm build
      - name: Check (meta, CSP, links, anchors, images, sitemap, budgets)
        run: pnpm check
      - name: Copy rules and leak scan (tools/site_check.py)
        run: python scripts/content_check.py dist
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist
      # Built-site regression tests (tests/test_web_*.py, marker web_dist). The Python job in
      # build.yml skips them because it does not build web/; here they must run. They run after the
      # Pages artifact upload so nothing a test writes into dist can be published; a failure still
      # fails this job, so deploy does not run.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the package (for the test suite)
        working-directory: .
        run: pip install ".[dev]"
      - name: Install Chromium (browser-driven site tests)
        working-directory: .
        run: python -m playwright install --with-deps chromium
      - name: Built-site tests (pytest -m web_dist)
        working-directory: .
        env:
          FREEMYID_REQUIRE_WEB_DIST: "1"
        # exit 5 = no web_dist tests collected (none exist yet on this branch): not a failure
        run: pytest -q -m web_dist || [ $? -eq 5 ]

  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # IndexNow: tell Bing/Yandex/Seznam/Naver the site changed. Sends only public URLs from the live
      # sitemap. Key file is site_src/static/<key>.txt (served at the site root). Never fails the deploy.
      - name: IndexNow ping
        continue-on-error: true
        env:
          INDEXNOW_KEY: 2b3da124d08af987b483dfb5ca217d9f
          SITE: https://freemyid.org
        run: |
          sleep 60
          curl -fsS --max-time 20 "$SITE/$INDEXNOW_KEY.txt" | grep -qx "$INDEXNOW_KEY" || { echo "key file not live yet"; exit 0; }
          urls=$(curl -fsS --max-time 20 "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep "^$SITE/" | head -1000)
          [ -n "$urls" ] || { echo "no sitemap urls"; exit 0; }
          body=$(printf '%s\n' "$urls" | jq -R . | jq -sc --arg k "$INDEXNOW_KEY" --arg h "${SITE#https://}" \
            '{host:$h,key:$k,keyLocation:("https://"+$h+"/"+$k+".txt"),urlList:.}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data "$body")
          echo "IndexNow: $(printf '%s\n' "$urls" | wc -l) urls, HTTP $code"
