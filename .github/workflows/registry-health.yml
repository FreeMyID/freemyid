name: registry-health

# Weekly offline check of the public sample registry (schema, https, email syntax, citations,
# stale verified dates). No network checks: --online stays a local, hand-run option.
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --disable-pip-version-check .
      - name: Registry health (offline)
        run: python tools/registry_health.py --report registry-health.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-health
          path: registry-health.md
          retention-days: 30
