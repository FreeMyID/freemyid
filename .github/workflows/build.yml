name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Playwright Chromium (CI runner only)
        run: python -m playwright install --with-deps chromium
      - name: Tests
        timeout-minutes: 25
        env:
          FREEMYID_REQUIRE_BROWSER: "1"   # real-browser tests must run here, never skip
        run: pytest -q

  windows-installer:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (with packaging extras)
        run: pip install ".[package,dev]"
      - name: Playwright Chromium (CI runner only)
        run: python -m playwright install chromium
      - name: Tests
        timeout-minutes: 30
        run: pytest -q
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import freemyid; print(freemyid.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
      # Broker registry: the public repo carries only brokers/registry.sample.yaml, which is always
      # bundled. The full maintained registry lives in a private data repo. When it is set up, a
      # step here will check it out with a read-only secret (for example FREEMYID_DATA_TOKEN) and
      # copy registry.yaml into brokers/ before PyInstaller; the spec bundles it if present.
      # Until then (and for forks / pull requests, which never get secrets) builds ship the sample.
      - name: Registry in this build
        shell: pwsh
        run: |
          if (Test-Path brokers/registry.yaml) { Write-Host "Bundling FULL registry" } else { Write-Host "Bundling SAMPLE registry only" }
      - name: "PyInstaller (onedir, FreeMyID.exe and freemyid-cli.exe)"
        run: pyinstaller packaging/windows/freemyid.spec --noconfirm --distpath dist --workpath build
      - name: Smoke test the built program
        shell: pwsh
        run: |
          ./dist/FreeMyID/freemyid-cli.exe registry validate
          # Public builds must carry only the sample registry (the full one is private).
          $src = (./dist/FreeMyID/freemyid-cli.exe registry source --plain).Trim()
          Write-Host "registry source: $src"
          if ($src -ne "sample") { throw "public build must bundle only the sample registry, got '$src'" }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\freemyid.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Install test (silent install, run, schedule task, silent uninstall)
        timeout-minutes: 10
        shell: pwsh
        run: |
          # CI runners are disposable, so installing a per-user scheduled task here is fine.
          $PSNativeCommandUseErrorActionPreference = $false
          $setup = (Get-ChildItem dist\FreeMyIDSetup-*.exe | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\FreeMyID"
          $cli = Join-Path $app "freemyid-cli.exe"
          if (-not (Test-Path $cli)) { throw "freemyid-cli.exe missing from $app" }
          function Run($exe, $argList) {
            & $exe @argList
            if ($LASTEXITCODE -ne 0) { throw "$exe $argList failed with $LASTEXITCODE" }
          }
          Run $cli @("--help")
          Run $cli @("registry", "validate")
          Run $cli @("schedule", "install")
          if (-not (Get-ScheduledTask -TaskName "Free My ID Recheck" -ErrorAction SilentlyContinue)) { throw "task missing after schedule install" }
          Run $cli @("schedule", "remove")
          if (Get-ScheduledTask -TaskName "Free My ID Recheck" -ErrorAction SilentlyContinue) { throw "task still present after schedule remove" }
          $un = Join-Path $app "unins000.exe"
          $p = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exit code $($p.ExitCode)" }
          # the uninstaller process may finish copying itself away; give it a moment
          for ($i = 0; $i -lt 20 -and (Test-Path $app); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { throw "app folder still present after uninstall" }
          Write-Host "Install test passed"
          exit 0
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: FreeMyIDSetup-${{ steps.ver.outputs.version }}
          path: dist/FreeMyIDSetup-${{ steps.ver.outputs.version }}.exe
          if-no-files-found: error

  # On a v* tag: publish a GitHub Release with the installer under a stable name, so the
  # website's download button can always point at releases/latest/download/FreeMyIDSetup.exe.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test-linux, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: FreeMyIDSetup-${{ needs.windows-installer.outputs.version }}
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VER: ${{ needs.windows-installer.outputs.version }}
        run: |
          set -euo pipefail
          test "v$VER" = "$TAG" || { echo "tag $TAG does not match package version $VER"; exit 1; }
          cp "out/FreeMyIDSetup-$VER.exe" out/FreeMyIDSetup.exe
          (cd out && sha256sum FreeMyIDSetup.exe "FreeMyIDSetup-$VER.exe" > SHA256SUMS.txt)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Free My ID $VER" \
            --notes "Windows installer. The file is not code-signed yet, so Windows may show a blue 'Windows protected your PC' box: click More info, then Run anyway." \
            out/FreeMyIDSetup.exe "out/FreeMyIDSetup-$VER.exe" out/SHA256SUMS.txt

  # After a release: put its version, size and sha256 on the website, rebuild site/, commit to main and
  # redeploy Pages (a GITHUB_TOKEN push doesn't trigger other workflows, so pages.yml is dispatched).
  site-release-info:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update release info and rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          python -m pip install --disable-pip-version-check "jinja2>=3.1" "PyYAML>=6"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p FreeMyIDSetup.exe -p SHA256SUMS.txt -D rel
          (cd rel && grep " FreeMyIDSetup.exe$" SHA256SUMS.txt | sha256sum -c -)
          python tools/update_release_info.py "$VER" rel/FreeMyIDSetup.exe --date "$(date -u +%F)"
          python tools/build_site.py
          python tools/build_site.py --check
          if git diff --quiet -- site_src/data/release.yaml site; then echo "site already current"; exit 0; fi
          git -c user.name="Release Bot [freemyid]" -c user.email=242299803+GrayManSam@users.noreply.github.com \
            commit -m "Site: v$VER release info (automatic)" -- site_src/data/release.yaml site
          git push origin HEAD:main
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
