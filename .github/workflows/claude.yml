name: claude

# Claude on GitHub, review and comment only (owner decision 2026-11-08).
# Start it with the "claude" label on an issue or PR, or "@claude" in a comment.
# Only people with write access can trigger it (the action's default; allowed_non_write_users is unset).
# It can never push: the job token has contents: read, and file editing, Bash (so no git, gh approve
# or merge, no running PR code) and web tools are blocked. PR text from outsiders is untrusted input:
# with no shell, a prompt injection cannot run commands or reach the token.
# Merges stay local --no-ff under the noreply identity (docs/SDLC.md).
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          trigger_phrase: "@claude"
          claude_args: >-
            --disallowedTools Edit,Write,NotebookEdit,Bash,WebFetch,WebSearch
            --append-system-prompt "You review and advise only; never write commits. Follow CLAUDE.md and docs/SDLC.md. Never quote or ask for personal data."
