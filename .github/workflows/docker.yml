name: docker

# Build packaging/docker/Dockerfile, smoke-run it, and on v* tags push to GHCR, sign (cosign keyless),
# attach an SBOM (syft) and build provenance. Skips cleanly while the Dockerfile does not exist.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["packaging/docker/**", "src/**", "pyproject.toml", ".github/workflows/docker.yml"]
  pull_request:
    paths: ["packaging/docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/freemyid/freemyid
  DH_IMAGE: docker.io/freemyid/freemyid
  # Docker Hub mirror is on only when the repo variable DOCKERHUB_PUBLISH is 'true'
  DH_ON: ${{ vars.DOCKERHUB_PUBLISH == 'true' }}

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dockerfile present?
        id: has
        run: |
          if [ -f packaging/docker/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::packaging/docker/Dockerfile not found yet; skipping"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.has.outputs.present == 'true'
      - name: Build (local, not pushed)
        if: steps.has.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          load: true
          tags: freemyid:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke run
        if: steps.has.outputs.present == 'true'
        run: |
          set -euo pipefail
          # the image ENTRYPOINT is already `freemyid`, so pass only the subcommand
          docker run --rm freemyid:ci --help > /dev/null
          docker run --rm freemyid:ci doctor --json > doctor.json || echo "doctor exit code $? (checks may warn in a bare container)"
          python3 -c "import json; json.load(open('doctor.json')); print('doctor --json is valid JSON')"
          # hardening expectations: non-root user
          uid=$(docker run --rm --entrypoint id freemyid:ci -u); [ "$uid" != "0" ] || { echo "image runs as root"; exit 1; }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # cosign keyless + provenance
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Dockerfile present?
        id: has
        run: |
          if [ -f packaging/docker/Dockerfile ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "::notice::no Dockerfile; nothing to publish"; fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.has.outputs.present == 'true'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: steps.has.outputs.present == 'true'
      - name: Log in to GHCR
        if: steps.has.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub (access token, never the password)
        if: steps.has.outputs.present == 'true' && vars.DOCKERHUB_PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image tags (no "latest" for pre-releases)
        id: tags
        if: steps.has.outputs.present == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "${IMAGE}:${TAG}"
            [ "$DH_ON" = "true" ] && echo "${DH_IMAGE}:${TAG}"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "${IMAGE}:latest"
              [ "$DH_ON" = "true" ] && echo "${DH_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        if: steps.has.outputs.present == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          provenance: mode=max
          sbom: false
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
      - name: Sign the image (cosign keyless)
        if: steps.has.outputs.present == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          [ "$DH_ON" = "true" ] && cosign sign --yes "${DH_IMAGE}@${DIGEST}" || true
      - name: SBOM (syft, SPDX)
        if: steps.has.outputs.present == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach SBOM to the image as a signed attestation
        if: steps.has.outputs.present == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
          if [ "$DH_ON" = "true" ]; then cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${DH_IMAGE}@${DIGEST}"; fi
