name: Copilot Setup Steps

# Prepares the GitHub Copilot coding agent's environment before it starts a work order (docs/vendor/COPILOT.md).
# Copilot runs the `copilot-setup-steps` job itself; the triggers below only validate this file when it changes.
# Only steps/permissions/runs-on/services/snapshot/timeout-minutes are honoured in this job (job-level env is not).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Actions pinned to full commit SHAs (SEC-61), same pins as pages.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python dependencies (project + dev tools)
        run: pip install -e ".[dev]"
      - name: Playwright Chromium for offline browser tests
        run: python -m playwright install --with-deps chromium
      - name: Website dependencies (exact versions from the lockfile)
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm install --frozen-lockfile
      - name: Build the site once so tests/test_web_* have web/dist
        working-directory: web
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: pnpm build
