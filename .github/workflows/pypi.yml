name: pypi

# Publish to PyPI on v* tags via Trusted Publishing (OIDC, no token anywhere).
# Skips cleanly until the owner finishes the one-time pypi.org setup and sets the repo variable
# PYPI_PUBLISH=true (see docs/handoff/devops-engineer.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      # SEC-111: hashes travel as job outputs (not via the artifact store), so a later job that
      # holds the Actions runtime token cannot swap the files without publish noticing.
      dist_sha256: ${{ steps.hash.outputs.sums }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # BL-IN-42: pinned hash-checked toolchain, SOURCE_DATE_EPOCH = commit time (see docs/REPRODUCIBLE.md)
          python -m pip install --disable-pip-version-check --require-hashes -r tools/ci/build-requirements.txt
          tools/ci/repro_build.sh dist
          python -m twine check --strict dist/*
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$ver" = "$TAG" || { echo "tag $TAG does not match pyproject version $ver"; exit 1; }
      - name: Record SHA-256 of every dist file
        id: hash
        working-directory: dist
        run: |
          set -euo pipefail
          {
            echo "sums<<EOF"
            sha256sum -- *
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  # SEC-111: the SBOM action runs in its own job with read-only access to the already-uploaded
  # artifact, so a compromised action cannot alter the wheel that gets published.
  sbom:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the wheel into a clean venv (SBOM input)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/pip" install --disable-pip-version-check dist/*.whl
      - name: SBOM of the wheel and its resolved dependencies (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.18.1
          path: ${{ runner.temp }}/sbom-venv/lib
          format: spdx-json
          output-file: ${{ runner.temp }}/freemyid-wheel.spdx.json
          artifact-name: freemyid-wheel.spdx.json
          upload-release-assets: false

  publish:
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/freemyid/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist
      - name: Verify dist files against the hashes recorded by the build job
        env:
          SUMS: ${{ needs.build.outputs.dist_sha256 }}
        working-directory: dist
        run: |
          set -euo pipefail
          test -n "$SUMS"
          printf '%s\n' "$SUMS" | sha256sum -c -
          # no extra files either
          test "$(ls | wc -l)" = "$(printf '%s\n' "$SUMS" | wc -l)"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
