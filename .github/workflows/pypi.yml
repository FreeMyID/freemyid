name: pypi

# Publish to PyPI on v* tags via Trusted Publishing (OIDC, no token anywhere).
# Skips cleanly until the owner finishes the one-time pypi.org setup and sets the repo variable
# PYPI_PUBLISH=true (see docs/handoff/devops-engineer.md).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build twine
          python -m build
          python -m twine check --strict dist/*
          ver=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$ver" = "$TAG" || { echo "tag $TAG does not match pyproject version $ver"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-dist
          path: dist/
          if-no-files-found: error

  publish:
    if: vars.PYPI_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/freemyid/
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
