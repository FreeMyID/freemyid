# Weekly dependency update PRs (reviewed before merge; nothing auto-merges).
# Minor/patch updates are grouped into one PR per ecosystem; majors are NOT grouped, so each major
# arrives as its own PR with its own changelog to read (SEC-67).
# Actions stay pinned to full commit SHAs with a "# vX.Y.Z" comment (SEC-61): Dependabot rewrites both.
# The npm side also honours web/pnpm-workspace.yaml (minimumReleaseAge, no dependency build scripts).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions-minor-patch: {update-types: [minor, patch], patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      python-minor-patch: {update-types: [minor, patch], patterns: ["*"]}
  - package-ecosystem: pip
    directory: /tools/ci
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    # hash-pinned build toolchain + twine (SEC-121): a bump must be reviewed, regenerate the hashes, never auto-merge
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      web-minor-patch: {update-types: [minor, patch], patterns: ["*"]}
  - package-ecosystem: docker
    directory: /packaging/docker
    schedule: {interval: weekly}
    # The image Python follows the tested range (CI runs 3.12; pyproject classifiers 3.11/3.12).
    # Move it by hand after a CI matrix run on the new version; take patch rebuilds only.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
