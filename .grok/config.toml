# Grok vendor bounds for Free My ID (in-house owned: Morgan Reyes, 2026-11-09). Vendors never edit this file.
# Layer 1 is the kernel sandbox in ~/.grok/sandbox.toml (profile "freemyid", the default in ~/.grok/config.toml):
#   in-house paths read-only, private data unreadable, no network for shell commands.
# Layer 2 (this file) is permission rules. Deny always wins, including over always-approve.
# The contract is AGENTS.md ("Grok vendor" section). Process: docs/VENDOR.md.

[permission]
deny = [
  # No git/GitHub, installs, network tools, privilege or containers.
  "Bash(git)", "Bash(git *)", "Bash(gh)", "Bash(gh *)",
  "Bash(pip)", "Bash(pip *)", "Bash(pip3)", "Bash(pip3 *)", "Bash(*-m pip*)", "Bash(*pip install*)",
  "Bash(uv)", "Bash(uv *)", "Bash(pipx *)", "Bash(pnpm)", "Bash(pnpm *)", "Bash(npm)", "Bash(npm *)",
  "Bash(npx)", "Bash(npx *)", "Bash(yarn *)", "Bash(playwright install*)",
  "Bash(curl)", "Bash(curl *)", "Bash(wget)", "Bash(wget *)", "Bash(ssh *)", "Bash(scp *)", "Bash(rsync *)",
  "Bash(sudo *)", "Bash(su *)", "Bash(docker *)", "Bash(podman *)", "Bash(rm -rf *)", "Bash(chmod -R *)",
  "Bash(*freemyid run*)", "Bash(*freemyid send*)", "Bash(*schedule install*)",
  "WebSearch", "WebFetch",

  # Secrets and the owner's real data.
  "Read(~/.ssh/**)", "Read(~/.config/**)", "Read(~/.codex/**)", "Read(~/.claude/**)",
  "Read(~/.freemyid/**)", "Read(~/.local/share/keyrings/**)", "Read(**/.env)", "Read(**/.env.*)",
  "Bash(*.freemyid*)", "Bash(*keyrings*)", "Bash(*/.ssh*)", "Bash(*/.config/*)", "Bash(*freemyid-private*)",
  "Bash(*secret-tool*)", "Bash(*printenv*)", "Bash(env)", "Bash(env *)",

  # In-house only (Edit and Write both, so new files are blocked too).
  # src/: only Grok's backend lane is writable (AGENTS.md 'Your lane', 2026-11-09). Everything else in src/ denied:
  "Edit(src/freemyid/wizard/**)", "Write(src/freemyid/wizard/**)", "Edit(src/freemyid/templates/**)", "Write(src/freemyid/templates/**)", "Edit(src/freemyid/storage/**)", "Write(src/freemyid/storage/**)", "Edit(src/freemyid/crypto.py)", "Write(src/freemyid/crypto.py)", "Edit(src/freemyid/secrets.py)", "Write(src/freemyid/secrets.py)", "Edit(src/freemyid/secret_backends.py)", "Write(src/freemyid/secret_backends.py)", "Edit(src/freemyid/netpolicy.py)", "Write(src/freemyid/netpolicy.py)", "Edit(src/freemyid/consent.py)", "Write(src/freemyid/consent.py)", "Edit(src/freemyid/logging_setup.py)", "Write(src/freemyid/logging_setup.py)", "Edit(src/freemyid/models.py)", "Write(src/freemyid/models.py)", "Edit(src/freemyid/interfaces.py)", "Write(src/freemyid/interfaces.py)", "Edit(src/freemyid/state.py)", "Write(src/freemyid/state.py)", "Edit(src/freemyid/registry.py)", "Write(src/freemyid/registry.py)", "Edit(src/freemyid/cli.py)", "Write(src/freemyid/cli.py)", "Edit(src/freemyid/config.py)", "Write(src/freemyid/config.py)", "Edit(src/freemyid/paths.py)", "Write(src/freemyid/paths.py)", "Edit(src/freemyid/engine/browser.py)", "Write(src/freemyid/engine/browser.py)", "Edit(src/freemyid/engine/matcher.py)", "Write(src/freemyid/engine/matcher.py)", "Edit(src/freemyid/engine/nicknames.py)", "Write(src/freemyid/engine/nicknames.py)", "Edit(src/freemyid/engine/exposure.py)", "Write(src/freemyid/engine/exposure.py)", "Edit(src/freemyid/engine/exposure_score.py)", "Write(src/freemyid/engine/exposure_score.py)", "Edit(src/freemyid/engine/listing_finder.py)", "Write(src/freemyid/engine/listing_finder.py)", "Edit(src/freemyid/engine/search_engines.py)", "Write(src/freemyid/engine/search_engines.py)", "Edit(src/freemyid/engine/law_matrix.py)", "Write(src/freemyid/engine/law_matrix.py)", "Edit(src/freemyid/engine/letters.py)", "Write(src/freemyid/engine/letters.py)", "Edit(src/freemyid/engine/htmlsel.py)", "Write(src/freemyid/engine/htmlsel.py)", "Edit(src/freemyid/monitor.py)", "Write(src/freemyid/monitor.py)", "Edit(src/freemyid/exposure_models.py)", "Write(src/freemyid/exposure_models.py)", "Edit(src/freemyid/checklists.py)", "Write(src/freemyid/checklists.py)", "Edit(src/freemyid/checklist_state.py)", "Write(src/freemyid/checklist_state.py)", "Edit(src/freemyid/doctor.py)", "Write(src/freemyid/doctor.py)", "Edit(src/freemyid/__init__.py)", "Write(src/freemyid/__init__.py)", "Edit(src/freemyid/engine/_dev/**)", "Write(src/freemyid/engine/_dev/**)",
  "Edit(web/**)", "Write(web/**)",
  "Edit(.github/**)", "Write(.github/**)", "Edit(packaging/**)", "Write(packaging/**)",
  "Edit(.claude/**)", "Write(.claude/**)", "Edit(.codex/**)", "Write(.codex/**)",
  "Edit(.grok/**)", "Write(.grok/**)", "Edit(tools/**)", "Write(tools/**)",
  "Edit(brokers/**)", "Write(brokers/**)", "Edit(schema/**)", "Write(schema/**)",
  "Edit(pyproject.toml)", "Write(pyproject.toml)",
  "Edit(AGENTS.md)", "Write(AGENTS.md)", "Edit(CLAUDE.md)", "Write(CLAUDE.md)",
  "Edit(GEMINI.md)", "Write(GEMINI.md)", "Edit(docs/VENDOR.md)", "Write(docs/VENDOR.md)",
  "Edit(docs/research/**)", "Write(docs/research/**)",
  "Edit(docs/vendor/WO-*.md)", "Write(docs/vendor/WO-*.md)",
  "Edit(docs/vendor/grok-team/**)", "Write(docs/vendor/grok-team/**)",
  "Edit(docs/vendor/CLAUDE_TO_*.md)", "Write(docs/vendor/CLAUDE_TO_*.md)",

  # Codex's lane and channel (one vendor per lane).
  "Edit(tests/codex/**)", "Write(tests/codex/**)", "Edit(docs/dev/**)", "Write(docs/dev/**)",
  "Edit(docs/i18n/**)", "Write(docs/i18n/**)", "Edit(brand/codex/**)", "Write(brand/codex/**)",
  "Edit(docs/vendor/CODEX_*.md)", "Write(docs/vendor/CODEX_*.md)",
  "Edit(docs/vendor/BOARD.md)", "Write(docs/vendor/BOARD.md)",
  "Edit(docs/vendor/codex-team/**)", "Write(docs/vendor/codex-team/**)",
]
