# Page manifest for tools/build_site.py. `out` is the output folder (clean URL); "" is the home page.
# Titles <= 60 characters, descriptions <= 155 (site_check enforces both).
# jsonld: organization | website | software | faq | breadcrumbs. Broker guides are added from the
# public sample registry automatically (template pages/guide.html).
# og_image / og_alt (v3 build): a file name in web/src/art/og/ and its alt text. A name whose file
# isn't there yet falls back to og-home (web/src/lib/og.ts), so entries can land before the art.
- id: home
  out: ""
  template: pages/home.html
  label: Home
  title: "Free My ID: take your name off the websites that sell it"
  description: Free My ID takes your name, address and phone number off the people-search websites that sell them. Free, open source, runs on your own computer.
  jsonld: [organization, website, software]
- id: how-it-works
  out: how-it-works/
  template: pages/how-it-works.html
  label: How it works
  nav: how-it-works
  title: "How Free My ID works: by email, with you, or for you"
  description: Free My ID sends removal requests three ways - by email, by guiding you through a site's form, or by filling the form in for you - and keeps checking.
  jsonld: [breadcrumbs]
- id: guides
  out: guides/
  template: pages/guides.html
  label: Opt-out guides
  nav: guides
  title: "Free opt-out guides for people-search sites"
  description: Step-by-step, plain-English guides to remove yourself from Spokeo, Whitepages, BeenVerified and other people-search sites. Free, no app needed.
  jsonld: [breadcrumbs]
- id: help-a-parent
  out: guides/help-a-parent-remove-their-information/
  template: pages/help-a-parent.html   # not used: v3_only (web/src/pages/guides/help-a-parent-remove-their-information/index.astro)
  v3_only: true
  label: Help a parent
  nav: guides
  title: "Help a parent get their details off people-search sites"
  description: A calm, step-by-step way to help a parent or grandparent ask people-search sites to take down their name, address and phone number.
  jsonld: [breadcrumbs]
- id: phone-number
  out: guides/get-your-phone-number-off-people-search-sites/
  template: pages/phone-number.html   # not used: v3_only (web/src/pages/guides/get-your-phone-number-off-people-search-sites/index.astro)
  v3_only: true
  label: Your phone number
  nav: guides
  title: "Get your phone number off people-search sites"
  description: Why your phone number can show up on people-search sites, and the free steps to ask each one to remove the listing that shows it.
  jsonld: [breadcrumbs]
- id: protect
  out: protect/
  template: pages/protect.html   # not used: v3_only (web/src/pages/protect/index.astro, from brokers/checklists.yaml)
  v3_only: true
  label: Protect yourself
  nav: protect
  title: "Protect yourself: free credit freezes and opt-outs"
  description: Free, plain-English steps to freeze your credit, stop pre-approved offers, and lock down your IRS, Social Security and USPS accounts. No app needed.
  jsonld: [breadcrumbs]
- id: credit-freeze
  out: protect/credit-freeze/
  template: pages/credit-freeze.html   # not used: v3_only (web/src/pages/protect/credit-freeze/index.astro)
  v3_only: true
  label: Credit freeze checklist
  nav: protect
  title: "Credit freeze checklist: freeze all three bureaus free"
  description: A free credit freeze stops a thief opening new credit in your name. A printable checklist for Equifax, Experian and TransUnion, and help for a parent.
  jsonld: [breadcrumbs]
- id: families
  out: families/
  template: pages/families.html
  label: Helping a parent
  nav: families
  title: "Helping a parent or grandparent use Free My ID"
  description: A plain-language guide for family members setting up Free My ID for someone else, with a printable card for the fridge.
  jsonld: [breadcrumbs]
- id: safety
  out: safety/
  template: pages/safety.html
  label: Is it safe?
  nav: safety
  title: "Is Free My ID safe? No account, no cloud, open source"
  description: Free My ID keeps your details on your own computer, encrypted. What it stores, what it never asks for, how to check the download, and how to uninstall.
  jsonld: [breadcrumbs]
- id: faq
  out: faq/
  template: pages/faq.html
  label: Questions
  nav: faq
  title: "Questions about Free My ID, answered plainly"
  description: Is it free? Will it ask for my Social Security number? Do sites have to remove me? Plain-English answers about Free My ID.
  jsonld: [faq, breadcrumbs]
- id: download
  out: download/
  template: pages/download.html
  label: Download
  nav: download
  title: "Download Free My ID for Windows 10 and 11 (free)"
  description: Download Free My ID for Windows 10 and 11. Free. Includes a step-by-step guide, with pictures, for the blue Windows SmartScreen warning.
  jsonld: [software, breadcrumbs]
  og_image: og-download            # web/src/art/og/og-download.png (v3 build only)
  og_alt: Download Free My ID for Windows.
- id: i-do-not-consent
  out: i-do-not-consent/
  template: pages/i-do-not-consent.html
  label: The "I do not consent" post
  title: "Does the \"I do not consent\" Facebook post work?"
  description: Your instinct was right. Here is why the "I do not consent" post cannot reach the sites selling your details, and what can.
  jsonld: [breadcrumbs]
- id: developers
  out: developers/
  template: pages/developers.html   # not used: v3_only (web/src/pages/developers/index.astro)
  v3_only: true
  label: For developers
  title: "Free My ID for developers: Linux, macOS and headless"
  description: "Free My ID on Linux and macOS from the command line: pipx install, doctor, scheduling, secrets, JSON output. Docker image coming. Windows: get the app."   # WR-72 (release-notes-v0.2.0, WO-111: Docker not public)
  jsonld: [breadcrumbs]
- id: developers-cli
  out: developers/cli/
  template: pages/developers.html   # not used: v3_only (web/src/pages/developers/cli/index.astro, WO-137)
  v3_only: true
  label: Command reference
  title: "Free My ID command line reference"
  description: "The commands and options registered in the Free My ID command line, with the source line for each entry. Read-only reference."
  jsonld: [breadcrumbs]
- id: developers-config
  out: developers/config/
  template: pages/developers.html   # not used: v3_only (web/src/pages/developers/config/index.astro, WO-138)
  v3_only: true
  label: Setup file reference
  title: "Free My ID setup file reference (YAML)"
  description: "The fields of the YAML file for freemyid setup --from: person, permissions, mailbox and schedule, with a full made-up example."
  jsonld: [breadcrumbs]
- id: styleguide
  out: styleguide/
  template: pages/styleguide.html
  label: Style guide
  title: "Free My ID website style guide"
  description: Design tokens and components for the Free My ID website. For contributors.
  noindex: true
- id: "404"
  out: 404.html
  template: pages/404.html
  label: Page not found
  title: "Page not found - Free My ID"
  description: We couldn't find that page. Nothing is wrong with your computer.
  noindex: true
  absolute: true
- id: whats-coming
  out: whats-coming/
  template: pages/whats-coming.html   # not used: v3_only (web/src/pages/whats-coming/index.astro)
  v3_only: true
  label: What's coming
  title: "What's coming to Free My ID: our plain-words roadmap"
  description: What Free My ID does today and what we're building next, from Linux and Mac to a find-me-first scan, proof reports and family profiles. No dates promised.
  jsonld: [breadcrumbs]
