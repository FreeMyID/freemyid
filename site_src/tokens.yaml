# Design tokens, v2 (D6: clean, calm product look). tools/build_site.py turns these into the `tokens`
# CSS layer, the styleguide swatches and a contrast check (`pairs`) that fails the build if a pair
# drops below its minimum. Each color is [light, dark]. Hex only (the swatch ratios are computed).
color:
  bg:             ["#ffffff", "#0d131d"]   # page
  bg-alt:         ["#f4f6f9", "#121a26"]   # calm off-white alternate bands
  card:           ["#ffffff", "#172131"]   # raised cards (price card, trust items, faq) on any band
  surface:        ["#eef2f7", "#1a2434"]   # quiet panels: callouts, code, table header
  surface-strong: ["#e1e8f2", "#25334b"]   # icon tiles, chips
  text:           ["#151b26", "#eef1f6"]
  muted:          ["#414b5c", "#c0c8d5"]
  heading:        ["#14264a", "#dde7fb"]
  brand:          ["#1b3366", "#a9c3f3"]   # primary buttons, step numbers
  brand-ink:      ["#ffffff", "#0d131d"]   # text on brand
  brand-soft:     ["#e6edf8", "#1d2b45"]   # tinted tiles behind brand icons
  band-brand:     ["#1b2f5b", "#162543"]   # the one deep navy band (final CTA, .band--brand)
  band-brand-ink: ["#ffffff", "#eef1f6"]
  accent:         ["#a3202e", "#f5a3ab"]   # flag red: a small accent only. Never for alarm UI.
  link:           ["#17488f", "#a8caff"]
  ok:             ["#1c6639", "#8fd6a6"]   # "yes" cells, does-column, checklist ticks
  warn:           ["#7a4f00", "#f0c674"]   # "partial" cells, "waiting" chip
  line:           ["#dbe1ea", "#2a374d"]   # decorative hairlines
  line-strong:    ["#6b778c", "#8794ab"]   # borders that must meet 3:1
  focus:          ["#f2b705", "#f2b705"]   # gold focus ring (outer)
  focus-inner:    ["#151b26", "#eef1f6"]   # contrasting ring inside the gold so it shows on any page color
  footer-bg:      ["#0f1c38", "#080c14"]
  footer-text:    ["#e8edf6", "#dfe5ee"]
  flag-white:     ["#ffffff", "#e8edf6"]

# Contrast pairs checked at build time: [foreground, background, minimum ratio], in both themes.
pairs:
  - [text, bg, 7]
  - [text, bg-alt, 7]
  - [text, card, 7]
  - [text, surface, 7]
  - [muted, bg, 7]
  - [muted, bg-alt, 7]
  - [muted, card, 7]
  - [muted, surface, 7]
  - [heading, bg, 7]
  - [heading, bg-alt, 7]
  - [heading, card, 7]
  - [heading, surface, 7]
  - [link, bg, 7]
  - [link, bg-alt, 7]
  - [link, card, 7]
  - [link, surface, 7]
  - [link, surface-strong, 7]
  - [brand-ink, brand, 7]
  - [brand, bg, 4.5]
  - [brand, bg-alt, 4.5]
  - [brand, brand-soft, 4.5]
  - [band-brand-ink, band-brand, 7]
  - [accent, bg, 4.5]
  - [accent, bg-alt, 4.5]
  - [ok, bg, 4.5]
  - [ok, card, 4.5]
  - [ok, surface, 4.5]
  - [warn, card, 4.5]
  - [warn, surface, 4.5]
  - [line-strong, bg, 3]
  - [line-strong, card, 3]
  - [footer-text, footer-bg, 7]
  - [focus-inner, bg, 3]
  - [focus, band-brand, 3]
  - [focus, footer-bg, 3]

space:       # rem so it follows browser zoom; the larger steps are fluid
  3xs: 0.25rem
  2xs: 0.5rem
  xs: 0.75rem
  s: 1rem
  m: 1.5rem
  l: clamp(1.75rem, 1.5rem + 1vw, 2.25rem)
  xl: clamp(2.5rem, 2rem + 2vw, 3.5rem)
  2xl: clamp(3rem, 2rem + 4vw, 5rem)
  3xl: clamp(3.5rem, 2rem + 6vw, 6.5rem)

step:        # type scale; 1rem = 20px (html font-size 125%)
  "-1": 0.85rem
  "0": 1rem
  "1": clamp(1.1rem, 1.05rem + 0.3vw, 1.25rem)
  "2": clamp(1.25rem, 1.15rem + 0.5vw, 1.5rem)
  "3": clamp(1.5rem, 1.25rem + 1.2vw, 2.1rem)
  "4": clamp(1.85rem, 1.4rem + 2.2vw, 2.9rem)
  "5": clamp(2.1rem, 1.5rem + 3vw, 3.4rem)

radius:
  sm: 6px
  md: 10px
  lg: 16px
  xl: 24px
  pill: 999px

misc:
  wrap: 62rem          # page container
  measure: 36rem       # prose line length (~70 characters)
  tap: 3rem            # minimum control height (60px at default size, >= 48px at any size)
  gutter: clamp(1rem, 4vw, 2rem)
  font-body: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif'
  font-display: var(--font-body)   # v2: one sans family for headings and body (no civic serif)
  font-mono: 'ui-monospace, "Cascadia Mono", Consolas, "Liberation Mono", monospace'
  shadow-1: "0 1px 2px rgb(10 20 45 / 0.06), 0 1px 6px rgb(10 20 45 / 0.05)"
  shadow-2: "0 1px 3px rgb(10 20 45 / 0.07), 0 8px 24px rgb(10 20 45 / 0.09)"
  shadow-3: "0 2px 6px rgb(10 20 45 / 0.08), 0 20px 48px rgb(10 20 45 / 0.14)"
