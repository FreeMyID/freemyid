# Site-wide settings for tools/build_site.py. Custom domain freemyid.org (Cloudflare DNS -> GitHub Pages; the
# domain is set in the repo Pages settings, Actions deploys ignore a CNAME file).
name: Free My ID
tagline: Take your name off the websites that sell it.
base_url: https://freemyid.org/                  # canonical origin + path, trailing slash
base_path: /                                     # used only by 404.html (served at any depth)
repo_url: https://github.com/FreeMyID/freemyid
issues_url: https://github.com/FreeMyID/freemyid/issues/new/choose   # /developers/ only (owner rule: users never need an account)
# User questions go by email, no account needed (ROADMAP principle 6). Subject is prefilled; no body, so no PII.
support_email: support@freemyid.org
support_mailto: mailto:support@freemyid.org?subject=Free%20My%20ID%20question
releases_url: https://github.com/FreeMyID/freemyid/releases   # /developers/ only
# Our own address (Cloudflare 302 to the latest release asset, tools/cloudflare_redirects.py). Regular users never see github.com.
download_url: https://freemyid.org/get/windows
# Old hand-written URLs that now redirect to clean folder URLs.
redirects:
  download.html: download
  faq.html: faq
  how-it-works.html: how-it-works
  privacy.html: safety
  privacy/index.html: safety
