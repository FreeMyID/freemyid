[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vanish"
version = "0.1.0"
description = "Local-first personal data broker opt-out tool with scheduled re-checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "keyring>=25.0",
  "cryptography>=42.0",
  "rapidfuzz>=3.9",
  "playwright>=1.45",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "desktop-notifier>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]
pdf = ["weasyprint>=62"]
package = ["pyinstaller>=6.8"]

[project.scripts]
vanish = "vanish.cli:app"

[project.entry-points."vanish.submitters"]
# third-party/per-broker submitters register here: broker_id = "module:Class"

[tool.hatch.build.targets.wheel]
packages = ["src/vanish"]

[tool.hatch.build.targets.wheel.force-include]
"brokers" = "vanish/_data/brokers"
"schema" = "vanish/_data/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
