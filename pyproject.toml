[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "freemyid"
version = "0.1.2"
description = "Local-first personal data broker opt-out tool with scheduled re-checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "keyring>=25.0",
  "cryptography>=42.0",
  "rapidfuzz>=3.9",
  "playwright>=1.45",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "desktop-notifier>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pillow>=10"]
pdf = ["weasyprint>=62"]
package = ["pyinstaller>=6.8", "pywebview>=5.0"]

[project.scripts]
freemyid = "freemyid.cli:app"

[project.entry-points."freemyid.submitters"]
# third-party/per-broker submitters register here: broker_id = "module:Class"

[tool.hatch.build.targets.wheel]
packages = ["src/freemyid"]

[tool.hatch.build.targets.wheel.force-include]
"brokers" = "freemyid/_data/brokers"
"schema" = "freemyid/_data/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
module = ["webview", "weasyprint", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
