[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "freemyid"
version = "0.3.1"
description = "Local-first personal data broker opt-out tool with scheduled re-checks."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Free My ID" }]
keywords = ["privacy", "data-broker", "opt-out", "people-search", "gdpr", "ccpa"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jinja2>=3.1",
  "keyring>=25.0",
  "cryptography>=42.0",
  "rapidfuzz>=3.9",
  "playwright>=1.45,<1.66",  # 1.65 (2026-11-09) untested on Windows; bump deliberately with a VM run
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "desktop-notifier>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pillow>=10", "build>=1.2"]
pdf = ["weasyprint>=62"]
package = ["pyinstaller>=6.8", "pywebview>=5.0"]
tray = ["pystray>=0.19", "pillow>=10"]

[project.urls]
Homepage = "https://freemyid.org"
Source = "https://github.com/FreeMyID/freemyid"
Issues = "https://github.com/FreeMyID/freemyid/issues"

[project.scripts]
freemyid = "freemyid.cli:app"

[project.entry-points."freemyid.submitters"]
# third-party/per-broker submitters register here: broker_id = "module:Class"

[tool.hatch.build.targets.wheel]
packages = ["src/freemyid"]

[tool.hatch.build.targets.wheel.force-include]
# Public sample registry only. The full registry (brokers/registry.yaml) never ships in a wheel.
"brokers/registry.sample.yaml" = "freemyid/_data/brokers/registry.sample.yaml"
"brokers/state_laws.yaml" = "freemyid/_data/brokers/state_laws.yaml"
"brokers/LICENSE-DATA.md" = "freemyid/_data/brokers/LICENSE-DATA.md"
"brokers/state_law_deletion_matrix.yaml" = "freemyid/_data/brokers/state_law_deletion_matrix.yaml"
"brokers/checklists.yaml" = "freemyid/_data/brokers/checklists.yaml"
"schema" = "freemyid/_data/schema"

[tool.hatch.build.targets.sdist]
include = ["src/freemyid", "brokers/registry.sample.yaml", "brokers/state_laws.yaml",
  "brokers/LICENSE-DATA.md", "brokers/state_law_deletion_matrix.yaml",
  "brokers/checklists.yaml", "schema", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "windows_only: runs only on Windows",
    "posix_only: runs only on Linux/macOS",
    "macos_only: runs only on macOS",
    "linux_only: runs only on Linux",
    "browser: needs Playwright Chromium",
    "web_dist: reads the built website web/dist (auto for tests/test_web_*.py; skips if not built)",
    "real_scheduler: touches the real OS scheduler; CI=true only, needs an OS marker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[[tool.mypy.overrides]]
module = ["webview", "weasyprint", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
